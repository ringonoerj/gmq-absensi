name: gmq_absensi
description: GMQ Absensi System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.0.0
  
  # State Management
  provider: ^6.0.5
  
  # UI
  intl: ^0.18.1
  table_calendar: ^3.0.9
  
  # Storage
  shared_preferences: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Export
  excel: ^2.0.0
  pdf: ^3.10.4
  open_file: ^3.3.2
  file_picker: ^6.1.1
  path_provider: ^2.1.0
  
  # Connectivity for offline mode
  connectivity_plus: ^5.0.2
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
