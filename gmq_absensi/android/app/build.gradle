plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

import java.text.SimpleDateFormat

def incrementReleaseMetadata() {
    def propertiesFile = file("${project.rootDir}/gradle.properties")
    if (!propertiesFile.exists()) {
        return
    }
    
    // Read existing properties
    def props = new Properties()
    propertiesFile.withInputStream { props.load(it) }
    
    def currentMeta = props.getProperty('releaseMetadata')
    if (currentMeta == null || currentMeta.trim().isEmpty()) {
        currentMeta = "20260729_00"
    }
    
    // Format: yyyyMMdd_xx
    def parts = currentMeta.split('_')
    def storedDate = parts[0]
    def storedCounter = parts.length > 1 ? parts[1] : "00"
    
    // Get current local date in yyyyMMdd format
    def currentDate = new SimpleDateFormat("yyyyMMdd").format(new Date())
    
    def nextMeta
    if (currentDate == storedDate) {
        // Increment the counter
        def counterVal = 0
        try {
            counterVal = Integer.parseInt(storedCounter)
        } catch (NumberFormatException e) {
            // ignore
        }
        counterVal += 1
        def nextCounter = String.format("%02d", counterVal)
        nextMeta = "${currentDate}_${nextCounter}"
    } else {
        // Reset counter for the new day
        nextMeta = "${currentDate}_00"
    }
    
    // Update project property for current build evaluation
    project.setProperty('releaseMetadata', nextMeta)
    
    // Update gradle.properties file on disk
    def lines = propertiesFile.readLines()
    def newLines = []
    def found = false
    for (line in lines) {
        if (line.startsWith('releaseMetadata=')) {
            newLines.add("releaseMetadata=${nextMeta}")
            found = true
        } else {
            newLines.add(line)
        }
    }
    if (!found) {
        newLines.add("releaseMetadata=${nextMeta}")
    }
    propertiesFile.text = newLines.join('\n') + '\n'
    println "Auto-incremented releaseMetadata to ${nextMeta} in gradle.properties"
}

// Detect if we are running a release build task
def isReleaseBuild = false
for (taskName in gradle.startParameter.taskNames) {
    if (taskName.toLowerCase().contains("release")) {
        isReleaseBuild = true
    }
}

if (isReleaseBuild) {
    incrementReleaseMetadata()
}


android {
    namespace = "com.example.gmq_absensi"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.gmq_absensi"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            if (variant.buildType.name == "release") {
                def metadata = project.findProperty('releaseMetadata') ?: '20260729_00'
                outputFileName = "gmq_super_app_${metadata}.apk"
            }
        }
    }

    tasks.whenTaskAdded { task ->
        if (task.name == 'assembleRelease') {
            task.doLast {
                def metadata = project.findProperty('releaseMetadata') ?: '20260729_00'
                copy {
                    from "${buildDir}/outputs/apk/release/gmq_super_app_${metadata}.apk"
                    into "${buildDir}/outputs/flutter-apk/"
                }
            }
        }
    }
}

flutter {
    source = "../.."
}
